    <div class="brand">duit<i>·</i>gue</div>

      <button data-view="home">Beranda</button>
      <button data-view="emoney">E-money</button>
      <button data-view="cash">Dompet</button>
    </nav>
    <div class="spacer"></div>
    <span class="mode local" id="modeLbl" hidden>Tersimpan di perangkat ini</span>

  <main id="main">

<nav class="botnav" aria-label="Menu utama" hidden>
  <button data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-6h-5v6H4z"/></svg>Beranda</button>

  <button data-view="cash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>Dompet</button>
</nav>

<div class="backdrop" id="backdrop" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
