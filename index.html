<style>
/* Layout: mobile-first app shell — bottom nav + floating "Catat" on phones, top bar + two-column home on desktop. One bold element: the banknote-style total balance card. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#ECEEE9; --line:#DCE0D8;
  --fg:#18201C; --muted:#5D6661;
  --accent:#2B44C9; --accent-fg:#FFFFFF; --accent-soft:#E3E7FB;
  --note:#1C2C86; --note-fg:#F4F6FF; --note-line:rgba(255,255,255,.09);
  --in:#127A4B; --in-soft:#DCF0E5; --out:#C23950; --out-soft:#F8E0E4;
  --cash:#A86F12; --cash-soft:#F5EAD3;
  --shadow:0 10px 30px -12px rgba(24,32,28,.25);
  --f-display:"Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171D1A; --surface-2:#1F2622; --line:#2C3530;
  --fg:#E7ECE9; --muted:#9BA49F;
  --accent:#8E9DFF; --accent-fg:#0F1412; --accent-soft:#232A50;
  --note:#24337E; --note-fg:#F1F3FF; --note-line:rgba(255,255,255,.07);
  --in:#4FC58C; --in-soft:#163427; --out:#F27D8F; --out-soft:#3C1D24;
  --cash:#E3A74C; --cash-soft:#382B16;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171D1A; --surface-2:#1F2622; --line:#2C3530;
  --fg:#E7ECE9; --muted:#9BA49F;
  --accent:#8E9DFF; --accent-fg:#0F1412; --accent-soft:#232A50;
  --note:#24337E; --note-fg:#F1F3FF; --note-line:rgba(255,255,255,.07);
  --in:#4FC58C; --in-soft:#163427; --out:#F27D8F; --out-soft:#3C1D24;
  --cash:#E3A74C; --cash-soft:#382B16;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1060px;margin:0 auto;padding-block:16px 120px}

/* top bar */
.top{display:flex;align-items:center;gap:16px;padding-block:6px 18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px}
.brand i{font-style:normal;color:var(--accent)}
.top .spacer{flex:1}
.topnav{display:none;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.topnav button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.topnav button[aria-current="page"]{background:var(--fg);color:var(--bg)}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--out-soft);color:var(--out)}
.btn.armed{background:var(--out);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px}
.top .btn{display:none}
.mode{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.mode::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--in)}
.mode.local::before{background:var(--cash)}
@media (max-width:520px){.mode{display:none}}
.bookbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;max-width:48vw;min-width:0}
.bookbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bookbtn svg{width:14px;height:14px;flex:none;color:var(--muted)}
.bookbtn .tag{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.bookbtn.house .tag{background:var(--cash)}
.bookbtn.biz .tag{background:var(--in)}
.dot.biz{background:var(--in)}
/* toko & usaha */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.itile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px;position:relative}
.itile:hover{border-color:var(--fg)}
.itile .nm{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.itile .pr{font-weight:700;color:var(--accent);margin-top:auto}
.itile .st{font-size:12px;color:var(--muted);font-weight:600}
.itile .st.low{color:var(--out)}
.itile .qty{position:absolute;top:-8px;right:-6px;background:var(--accent);color:var(--accent-fg);border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-weight:800;font-size:13px;padding:0 6px;box-shadow:var(--shadow)}
.itile.in-cart{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:22;background:var(--fg);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);max-width:640px;margin:0 auto}
.cartbar .sum{flex:1;min-width:0;line-height:1.25}
.cartbar .sum b{font-size:18px;font-family:var(--f-display)}
.cartbar .sum small{display:block;opacity:.75;font-size:12.5px}
.cartbar .btn{background:var(--accent);color:var(--accent-fg)}
@media (min-width:860px){.cartbar{bottom:20px}}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cline .nm{font-weight:600;overflow-wrap:anywhere}
.cline .nm small{display:block;color:var(--muted);font-weight:500}
.cline .nm small.low{color:var(--out)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:16px}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.bigtotal{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bigtotal b{font-family:var(--f-display);font-size:28px;letter-spacing:-.02em}
.change{border-radius:12px;padding:10px 14px;background:var(--in-soft);color:var(--in);font-weight:700;display:flex;justify-content:space-between;gap:10px}
.change.short{background:var(--out-soft);color:var(--out)}
.irow{display:flex;align-items:center;gap:12px;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.irow:last-child{border-bottom:0}
.irow:hover{background:var(--surface-2)}
.irow .mid{flex:1;min-width:0}
.irow .t1{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .t2{display:block;font-size:12.5px;color:var(--muted)}
.irow.off{opacity:.55}
.rsrow{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,110px);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.rsrow .nm{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.rsrow .nm small{display:block;color:var(--muted);font-weight:500}
.rsrow .inp{padding:9px 10px;font-size:15px}
.toplist{display:flex;flex-direction:column;gap:10px}
.search{position:relative}
.search .inp{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}

/* bottom nav (phone) */
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.botnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 4px;border-radius:10px;flex:1;min-width:0}
.botnav button svg{width:22px;height:22px}
.botnav button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;border:0;border-radius:18px;background:var(--accent);color:var(--accent-fg);font-weight:700;padding:14px 20px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.fab svg{width:20px;height:20px}

@media (min-width:860px){
  .topnav,.top .btn{display:flex}
  .botnav,.fab{display:none}
  .app{padding-block:20px 60px}
}

/* generic blocks */
h1,h2,h3{margin:0;font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:600}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.view{display:flex;flex-direction:column;gap:18px}
.view[hidden]{display:none!important}

/* home */
.home-grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.home-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.greet h1{font-size:28px;font-weight:800}
.note{position:relative;overflow:hidden;border-radius:20px;padding:22px;background:var(--note);color:var(--note-fg);
  background-image:
   repeating-radial-gradient(circle at 110% -20%, transparent 0 14px, var(--note-line) 14px 15px),
   repeating-radial-gradient(circle at -10% 130%, transparent 0 18px, var(--note-line) 18px 19px);}
.note .eyebrow{color:var(--note-fg);opacity:.75}
.note .big{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,8vw,44px);letter-spacing:-.03em;line-height:1.1;margin-top:6px;overflow-wrap:anywhere}
.note .serial{position:absolute;right:18px;top:18px;font-size:11px;letter-spacing:.14em;opacity:.6;font-variant-numeric:tabular-nums}
.note .split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.note .pocket{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;border:0;color:inherit;text-align:left}
.note .pocket span{display:block;font-size:12px;opacity:.8}
.note .pocket b{font-size:16px;font-weight:700}
.week{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.stat .lbl{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.stat .val{font-size:18px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.stat.in .val{color:var(--in)} .stat.out .val{color:var(--out)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.in{background:var(--in)} .dot.out{background:var(--out)} .dot.cash{background:var(--cash)} .dot.em{background:var(--accent)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;border:1px dashed var(--cash);background:var(--cash-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.banner p{margin:0;flex:1;min-width:200px}

/* tx list */
.txlist{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.tx:last-child{border-bottom:0}
.tx:hover{background:var(--surface-2)}
.tx .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.tx .ic svg{width:18px;height:18px}
.tx.in .ic{background:var(--in-soft);color:var(--in)}
.tx.out .ic{background:var(--out-soft);color:var(--out)}
.tx.move .ic{background:var(--accent-soft);color:var(--accent)}
.tx .mid{flex:1;min-width:0}
.tx .t1,.tx .t2{display:block}
.tx .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700;white-space:nowrap}
.tx.in .amt{color:var(--in)} .tx.out .amt{color:var(--out)} .tx.move .amt{color:var(--muted)}
.daygrp{font-size:12px;font-weight:700;color:var(--muted);padding:14px 4px 4px;display:flex;justify-content:space-between}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0}

/* wallets */
.wgrid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.wgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}}
.wcard{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.wcard:last-child{border-bottom:0}
.wcard .badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);flex:none}
.wcard .badge.cash{background:var(--cash-soft);color:var(--cash)}
.wcard .badge.em{background:var(--accent-soft);color:var(--accent)}
.wcard .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcard .bal{font-weight:700;white-space:nowrap}
.sumline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sumline .v{font-family:var(--f-display);font-size:28px;font-weight:800;letter-spacing:-.02em}
.hint{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.hint svg{width:16px;height:16px;flex:none;margin-top:2px}

/* rekap */
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pnav{display:flex;align-items:center;gap:6px}
.pnav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.pnav button:disabled{opacity:.35;cursor:default}
.pnav button svg{width:16px;height:16px}
.pnav .lbl{min-width:0;text-align:center;padding-inline:6px;display:flex;flex-direction:column;line-height:1.25}
.pnav .lbl b{font-weight:700;font-size:15px}
.pnav .lbl small{font-size:12px;color:var(--muted);font-weight:600}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats3 .stat .val{font-size:clamp(16px,3.6vw,20px);white-space:nowrap;overflow-wrap:normal}
@media (max-width:520px){.stats3{grid-template-columns:1fr 1fr}.stats3 .net{grid-column:1/-1}}
.stat.net .val{color:var(--fg)}
.chart{position:relative;height:190px;display:flex;align-items:stretch;gap:6px;padding:0 0 26px 0;margin-top:6px}
.chart .grid{position:absolute;inset:0 0 26px 0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.chart .grid div{border-top:1px dashed var(--line);font-size:10.5px;color:var(--muted);text-align:right;line-height:1;padding-top:2px}

.col{flex:1;min-width:0;position:relative;display:flex;align-items:flex-end;justify-content:center;gap:3px}

.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-weight:600}

.cmrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px;align-items:center}

.cats{display:flex;flex-direction:column;gap:12px}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}

.rk-grid{display:grid;gap:18px;grid-template-columns:1fr}

/* onboarding */
.onb .big{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.money{position:relative}
.money .inp{padding-left:40px;font-weight:700;font-variant-numeric:tabular-nums}
.money::before{content:"Rp";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted);font-size:15px}
.emrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .dot{width:7px;height:7px}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
@media (min-width:860px){.backdrop{align-items:center}.sheet{border-radius:22px;padding:22px}}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto -6px}
.typeseg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}

.typeseg button[aria-pressed="true"][data-t="out"]{background:var(--out);color:#fff}
.typeseg button[aria-pressed="true"][data-t="in"]{background:var(--in);color:#fff}

.amount{font-family:var(--f-display);font-size:34px;font-weight:800;letter-spacing:-.02em;border:0;border-bottom:2px solid var(--line);background:none;width:100%;padding:4px 0 6px 46px;font-variant-numeric:tabular-nums;border-radius:0}
.amount:focus{outline:0;border-bottom-color:var(--accent)}
.amtwrap{position:relative}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--out);font-size:13px;font-weight:600;min-height:1em;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (min-width:860px){.toast{bottom:32px}}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
/* kontrakan */
.mlist{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--surface-2)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);background:var(--surface-2);color:var(--muted);flex:none}
.mrow .mid{flex:1;min-width:0}
.mrow .t1{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .t2{display:block;font-size:12.5px;color:var(--muted)}

.pill.lunas{background:var(--in-soft);color:var(--in)}
.pill.sebagian{background:var(--cash-soft);color:var(--cash)}
.pill.belum{background:var(--out-soft);color:var(--out)}
.mrow.lunas .av{background:var(--in-soft);color:var(--in)}
.dar{border-radius:20px;padding:18px;background:var(--surface);border:1px solid var(--line)}
.dar .v{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.evcard{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);text-align:left;width:100%;display:flex;flex-direction:column;gap:8px}

.evcard .nm{font-weight:700;font-size:16px}
.evnums{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}

.minus{color:var(--out)!important}
.report{white-space:pre-wrap;font-size:13.5px;line-height:1.55;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;max-height:52vh;overflow:auto;font-variant-numeric:tabular-nums;user-select:text}
.chooser{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.chooser{grid-template-columns:1fr 1fr}}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px}
.choice:hover{border-color:var(--fg)}
.choice b{font-family:var(--f-display);font-size:20px}
.choice span{color:var(--muted);font-size:14px}
.booklist{display:flex;flex-direction:column;gap:8px}
.bookrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.bookrow[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bookrow .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bookrow small{color:var(--muted);font-weight:600}
.memrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.memrow.off .inp{opacity:.5}
/* home pocket buttons */
.pockets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pk{border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:14px;min-width:0;background:var(--surface)}
.pk .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.pk .ico svg{width:22px;height:22px}
.pk.em .ico{background:var(--accent-soft);color:var(--accent)}
.pk.cs .ico{background:var(--cash-soft);color:var(--cash)}
.pk .nm{font-family:var(--f-display);font-weight:800;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pk .nm svg{width:16px;height:16px;color:var(--muted)}
.pk .sb{font-size:12.5px;color:var(--muted);font-weight:600}
.pk .vl{font-weight:700;font-size:clamp(15px,4vw,19px);overflow-wrap:anywhere}
.pk:hover{border-color:var(--fg)}
.pghead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pghead .v{font-family:var(--f-display);font-size:clamp(30px,8vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.pghead .acts{display:flex;gap:8px;flex-wrap:wrap}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);padding-top:6px}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .col .b{transition:height .3s ease}
}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
</style>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>(n<0?"−":"")+"Rp"+Math.abs(Math.round(n)).toLocaleString("id-ID");
const short=n=>{const a=Math.abs(n);const f=(v,u)=>(Math.round(v*10)/10).toLocaleString("id-ID")+u;
  if(a>=1e9)return f(n/1e9," M");if(a>=1e6)return f(n/1e6," jt");if(a>=1e3)return Math.round(n/1e3)+" rb";return String(Math.round(n));};
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pYmd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const HR=["Sen","Sel","Rab","Kam","Jum","Sab","Min"];
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const digits=s=>Number(String(s).replace(/\D/g,"").slice(0,13))||0;
const dotted=n=>n?n.toLocaleString("id-ID"):"";

const CATS={
  out:[["makan","Makan & minum"],["transport","Transport"],["jajan","Jajan & nongkrong"],["belanja","Belanja"],["tagihan","Tagihan & pulsa"],["hiburan","Hiburan"],["kesehatan","Kesehatan"],["lain","Lainnya"]],
  in:[["gaji","Gaji"],["saku","Uang saku"],["bonus","Bonus"],["hadiah","Hadiah"],["jualan","Hasil jualan"],["lain","Lainnya"]]
};
const HCATS={
  out:[["konsumsi","Konsumsi"],["perlengkapan","Perlengkapan"],["kegiatan","Acara & kegiatan"],["bersih","Kebersihan"],["perbaikan","Perbaikan"],["tagihan","Listrik, air & internet"],["sewa","Sewa"],["lain","Lainnya"]],
  in:[["iuran","Iuran bulanan"],["darurat","Iuran darurat"],["lain","Lainnya"]]
};
const SCATS={
  out:[["sewa","Sewa tempat"],["listrik","Listrik & air"],["gaji","Gaji karyawan"],["transport","Transport & ongkir"],["kemasan","Plastik & kemasan"],["perlengkapan","Perlengkapan"],["lain","Lainnya"]],
  in:[["lainjual","Penjualan di luar kasir"],["modal","Tambah modal"],["lain","Lainnya"]]
};
const FCATS={
  out:[["bahan","Bahan baku"],["gas","Gas & bahan bakar"],["kemasan","Kemasan"],["gaji","Gaji karyawan"],["sewa","Sewa tempat"],["listrik","Listrik & air"],["perlengkapan","Perlengkapan"],["lain","Lainnya"]],
  in:[["lainjual","Penjualan di luar kasir"],["modal","Tambah modal"],["lain","Lainnya"]]
};
const SPECIAL_CAT={jual:"Penjualan",hpp:"Modal barang terjual",kulakan:"Belanja stok",prive:"Ambil untung"};
const defCats=t=>({house:HCATS,shop:SCATS,food:FCATS}[bType()]||CATS)[t].map(([id,name])=>({id,name}));
const catList=t=>(S.cats&&Array.isArray(S.cats[t])&&S.cats[t].length)?S.cats[t]:defCats(t);
const catName=(t,c)=>c==="admin"?"Biaya admin":SPECIAL_CAT[c]&&!catList(t).some(x=>x.id===c)?SPECIAL_CAT[c]:((catList(t).find(x=>x.id===c))||{name:"Lainnya"}).name;
const EM_SUGGEST=["BCA","BRI","Mandiri","BNI","SeaBank","GoPay","OVO","DANA","ShopeePay"];
const IC={
  in:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  move:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18h3"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>'
};

/* ---------- state ---------- */
const S={ready:false,mode:"loading",store:{v:2,active:null,books:[]},view:"home",cart:{},q:"",rk:{unit:"week",off:0,filter:"all"},iu:{off:0},evOpen:null};
const FIELDS={wallets:"a",txs:"a",cats:null,sample:false,members:"a",dues:"a",events:"a",items:"a"};
function book(){return S.store.books.find(b=>b.id===S.store.active)||null;}
const isHouse=()=>{const b=book();return!!b&&b.type==="house";};
const bType=()=>{const b=book();return b?b.type:null;};
const isBiz=()=>bType()==="shop"||bType()==="food";
const isShop=()=>bType()==="shop";
const TYPES={personal:{label:"Pribadi",def:"Pribadi",dot:"em"},house:{label:"Uang bersama",def:"Uang Bersama",dot:"cash"},shop:{label:"Toko",def:"Toko",dot:"biz"},food:{label:"Usaha",def:"Usaha",dot:"biz"}};
const itemWord=()=>isShop()?"Barang":"Menu";
Object.keys(FIELDS).forEach(k=>Object.defineProperty(S,k,{
  get(){const b=book();const def=FIELDS[k]==="a"?[]:FIELDS[k];if(!b)return def;if(b.data[k]===undefined||b.data[k]===null&&FIELDS[k]==="a")b.data[k]=def;return b.data[k];},
  set(v){const b=book();if(b)b.data[k]=v;}
}));

/* ---------- money logic ---------- */
const wById=id=>S.wallets.find(w=>w.id===id);
const wName=id=>(wById(id)||{name:"(akun terhapus)"}).name;
const fundOf=t=>t&&t.fund==="darurat"?"darurat":"kas";
const toFundOf=t=>t.toFund==="darurat"||t.toFund==="kas"?t.toFund:fundOf(t);
const FUNDNAME={kas:"Kas bulanan",darurat:"Dana darurat"};
function fundBalances(){
  const f={kas:{},darurat:{}};S.wallets.forEach(w=>{f.kas[w.id]=Number(w.start)||0;f.darurat[w.id]=0;});
  for(const t of S.txs){const a=Number(t.amount)||0,fd=fundOf(t);
    if(t.type==="in"){if(t.wallet in f[fd])f[fd][t.wallet]+=a;}
    else if(t.type==="out"){if(t.wallet in f[fd])f[fd][t.wallet]-=a;}
    else if(t.type==="move"){const td=toFundOf(t);if(t.wallet in f[fd])f[fd][t.wallet]-=a+(Number(t.fee)||0);if(t.to in f[td])f[td][t.to]+=a;}
  }return f;
}
function balances(){const f=fundBalances(),b={};S.wallets.forEach(w=>b[w.id]=f.kas[w.id]+f.darurat[w.id]);return b;}
function totals(){
  const f=fundBalances(),b={};let cash=0,em=0;const fund={kas:{cash:0,em:0,all:0},darurat:{cash:0,em:0,all:0}};
  S.wallets.forEach(w=>{b[w.id]=f.kas[w.id]+f.darurat[w.id];const k=w.kind==="cash"?"cash":"em";
    fund.kas[k]+=f.kas[w.id];fund.darurat[k]+=f.darurat[w.id];if(k==="cash")cash+=b[w.id];else em+=b[w.id];});
  fund.kas.all=fund.kas.cash+fund.kas.em;fund.darurat.all=fund.darurat.cash+fund.darurat.em;
  return{b,f,cash,em,all:cash+em,fund};
}
function period(unit,off){
  const n=new Date();
  if(unit==="day"){const s=new Date(n.getFullYear(),n.getMonth(),n.getDate()+off);return{s,e:new Date(s)};}
  if(unit==="week"){const s=new Date(n.getFullYear(),n.getMonth(),n.getDate());s.setDate(s.getDate()-((s.getDay()+6)%7)+off*7);const e=new Date(s);e.setDate(s.getDate()+6);return{s,e};}
  const s=new Date(n.getFullYear(),n.getMonth()+off,1);return{s,e:new Date(s.getFullYear(),s.getMonth()+1,0)};
}
function periodLabel(unit,{s,e}){
  if(unit==="month")return BULAN[s.getMonth()]+" "+s.getFullYear();
  if(unit==="day")return HARI[s.getDay()]+", "+s.getDate()+" "+BLN[s.getMonth()]+" "+s.getFullYear();
  const sameM=s.getMonth()===e.getMonth();
  return s.getDate()+(sameM?"":" "+BLN[s.getMonth()])+" – "+e.getDate()+" "+BLN[e.getMonth()]+" "+e.getFullYear();
}
/* flows inside a date range; transfers are not income/expense, their admin fee is an expense */
function flows(s,e,filter){
  const a=ymd(s),b=ymd(e);
  const ok=id=>{if(filter==="all")return true;const w=wById(id);return w&&(filter==="cash"?w.kind==="cash":w.kind!=="cash");};
  const items=[];
  const H=isHouse(),BZ=isBiz(),SH=isShop();
  for(const t of S.txs){if(!t.date||t.date<a||t.date>b)continue;
    if(H&&fundOf(t)!=="kas")continue;
    if(BZ&&((t.type==="out"&&t.cat==="prive")||(t.type==="in"&&t.cat==="modal")))continue;
    if(SH&&t.type==="out"&&t.cat==="kulakan")continue;
    if(SH&&t.type==="in"&&Array.isArray(t.lines)&&ok(t.wallet)){const h=t.lines.reduce((x,l)=>x+(Number(l.cost)||0)*(Number(l.qty)||0),0);if(h>0)items.push({type:"out",amt:h,cat:"hpp",date:t.date});}
    if((t.type==="in"||t.type==="out")&&ok(t.wallet))items.push({type:t.type,amt:Number(t.amount)||0,cat:t.cat,date:t.date});
    if(t.type==="move"&&Number(t.fee)>0&&ok(t.wallet))items.push({type:"out",amt:Number(t.fee),cat:"admin",date:t.date});
  }
  let tin=0,tout=0;items.forEach(i=>i.type==="in"?tin+=i.amt:tout+=i.amt);
  return{items,tin,tout};
}
function sortedTx(list){return list.slice().sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:(y.created||0)-(x.created||0));}

function rekapHTML(){
  const R=S.rk,P=period(R.unit,R.off),f=flows(P.s,P.e,R.filter);
  const cols=[];const today=ymd(new Date());
  if(R.unit==="week"){for(let i=0;i<7;i++){const d=new Date(P.s);d.setDate(P.s.getDate()+i);cols.push({a:ymd(d),b:ymd(d),x:HR[i],today:ymd(d)===today});}}
  else{const last=P.e.getDate();for(let st=1;st<=last;st+=7){const en=Math.min(st+6,last);const a=new Date(P.s.getFullYear(),P.s.getMonth(),st),b=new Date(P.s.getFullYear(),P.s.getMonth(),en);cols.push({a:ymd(a),b:ymd(b),x:st+"–"+en,today:today>=ymd(a)&&today<=ymd(b)});}}
  cols.forEach(c=>{c.in=0;c.out=0;});
  f.items.forEach(i=>{const c=cols.find(c=>i.date>=c.a&&i.date<=c.b);if(c)c[i.type]+=i.amt;});
  const mx=Math.max(1,...cols.map(c=>Math.max(c.in,c.out)));
  const step=niceStep(Math.max(mx,2000)/2),top=step*2;
  const chart='<div class="chart" role="img" aria-label="Grafik uang masuk dan keluar"><div class="grid"><div>'+short(top)+'</div><div>'+short(step)+'</div><div>0</div></div>'+
    cols.map(c=>'<div class="col'+(c.today?" today":"")+'" title="'+esc(c.x)+': masuk '+rp(c.in)+', keluar '+rp(c.out)+'"><span class="b in" style="height:'+(c.in/top*100)+'%"></span><span class="b out" style="height:'+(c.out/top*100)+'%"></span><span class="x">'+c.x+'</span></div>').join("")+'</div>';
  const cm={};f.items.filter(i=>i.type==="out").forEach(i=>cm[i.cat]=(cm[i.cat]||0)+i.amt);
  const cl=Object.entries(cm).sort((a,b)=>b[1]-a[1]);const cmx=cl.length?cl[0][1]:1;
  const showB=R.unit==="month"&&R.filter==="all",hasB=catList("out").some(k=>k.budget>0);
  const rows=cl.map(([c,v])=>({c,v}));
  if(showB)catList("out").forEach(k=>{if(k.budget>0&&!k.hidden&&!cm[k.id])rows.push({c:k.id,v:0});});
  const cats=rows.length?'<div class="cats">'+rows.map(({c,v})=>{
      const bud=showB?((catList("out").find(k=>k.id===c)||{}).budget||0):0;
      if(!bud)return '<div class="cat"><div class="top2"><span>'+esc(catName("out",c))+'</span><b class="num">'+rp(v)+'</b></div><div class="bar"><i style="width:'+(v/cmx*100)+'%"></i></div></div>';
      const over=v>bud;

   (R.unit==="day"?dayListHTML(P,R.filter):'<div class="row between" style="flex-wrap:wrap"><h3>'+(R.unit==="week"?"Per hari":"Per minggu")+'</h3><div class="legend"><span><i class="dot in"></i>Masuk</span><span><i class="dot out"></i>Keluar</span></div></div>'+chart)+

   (hasB&&!showB?'<p class="muted" style="font-size:12.5px;margin:0">Batas pengeluaran tampil di rekap <b>Bulanan</b> dengan pilihan <b>Semua</b>.</p>':'')+

function dayListHTML(P,filter){
  const d=ymd(P.s);

  const list=sortedTx(S.txs.filter(t=>t.date===d&&ok(t)));
  if(!list.length)return"";
  return '<div class="row between"><h3>Transaksi</h3><span class="muted" style="font-size:13px">'+list.length+' catatan</span></div><div class="txlist">'+list.map(txRow).join("")+'</div>';
}
function relLabel(unit,off){
  if(unit==="day")return off===0?"Hari ini":off===-1?"Kemarin":(-off)+" hari lalu";
  if(unit==="week")return off===0?"Minggu ini":off===-1?"Minggu lalu":(-off)+" minggu lalu";
  return off===0?"Bulan ini":off===-1?"Bulan lalu":(-off)+" bulan lalu";
}
function niceStep(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}

/* ---------- sheet: transaction ---------- */
let F=null;
function openSheet(html,bind){$("#sheet").innerHTML='<div class="grab"></div>'+html;$("#backdrop").hidden=false;document.body.style.overflow="hidden";bind();}
function closeSheet(){$("#backdrop").hidden=true;$("#sheet").innerHTML="";document.body.style.overflow="";F=null;}
function openTx(id,ctx,preset){
  const t=id?S.txs.find(x=>x.id===id):null;
  if(t&&(Array.isArray(t.lines)||t.link)){openLinesTx(t);return;}
  if(t){const w=wById(t.wallet);ctx=isHouse()?null:(w&&w.kind==="cash"?"cash":"emoney");}
  const mine=S.wallets.filter(w=>ofKind(w,ctx));
  if(!mine.length){toast(ctx==="cash"?"Akun cash belum ada.":"Tambah akun e-money dulu.");return;}
  const other=S.wallets.find(w=>w.id!==mine[0].id);
  F=t?{...t}:{type:"out",amount:0,wallet:mine[0].id,to:other?other.id:null,fee:0,cat:(catList("out").find(c=>!c.hidden)||{id:"lain"}).id,date:ymd(new Date()),note:""};
  if(!t&&preset)Object.assign(F,preset);
  if(F.type==="in"&&preset&&preset.cat==null)F.cat=(catList("in").find(c=>!c.hidden)||{id:"lain"}).id;
  F.fund=F.fund==="darurat"?"darurat":"kas";F.toFund=F.toFund||F.fund;
  F.ctx=ctx;F.isEdit=!!t;
  drawTx(true);
}
const ofKind=(w,ctx)=>!ctx||(ctx==="cash"?w.kind==="cash":w.kind!=="cash");
function fundChips(sel,attr){return '<div class="chips" style="margin-top:6px">'+["kas","darurat"].map(k=>'<button class="chip" '+attr+'="'+k+'" aria-pressed="'+(sel===k)+'"><span class="dot '+(k==="kas"?"in":"out")+'"></span>'+FUNDNAME[k]+'</button>').join("")+'</div>';}
function walletChips(sel,attr,exclude,ctx){
  return '<div class="chips">'+S.wallets.filter(w=>w.id!==exclude&&ofKind(w,ctx)).map(w=>'<button class="chip" '+attr+'="'+esc(w.id)+'" aria-pressed="'+(sel===w.id)+'"><span class="dot '+(w.kind==="cash"?"cash":"em")+'"></span>'+esc(w.name)+'</button>').join("")+'</div>';
}
function drawTx(focus){
  const T=F.type,bal=balances();
  const H=isHouse(),fb=H?fundBalances():null;
  const hdr=(F.isEdit?"Ubah catatan":"Catat")+' <span class="muted" style="font-weight:600">· '+(F.ctx==="cash"?"Dompet":F.ctx==="emoney"?"E-money":FUNDNAME[F.fund])+'</span>';
  let body='<div class="row between"><h2>'+hdr+'</h2><button class="iconbtn" data-close aria-label="Tutup">'+IC.x+'</button></div>'+
   '<div class="typeseg" role="group" aria-label="Jenis">'+[["out","Keluar"],["in","Masuk"],["move","Pindah"]].map(([k,l])=>'<button data-t="'+k+'" aria-pressed="'+(T===k)+'">'+l+'</button>').join("")+'</div>'+
   '<div class="field"><label for="fAmt">Jumlah</label><div class="amtwrap"><input class="amount" id="fAmt" inputmode="numeric" autocomplete="off" placeholder="0" value="'+dotted(F.amount)+'"></div>'+
   '<div class="quick">'+[10000,20000,50000,100000].map(v=>'<button data-q="'+v+'">+'+short(v).replace(" ","")+'</button>').join("")+'<button data-q="0">Reset</button></div></div>'+
   '<div class="field"><label for="fNote">'+(T==="in"?"Uangnya dari mana?":T==="out"?"Uangnya buat apa?":"Keterangan")+'</label><input class="inp" id="fNote" maxlength="80" autocomplete="off" placeholder="'+(T==="move"?"mis. top up buat bayar ojol":T==="in"?"mis. kiriman ortu, gaji part-time":"mis. bakso depan kampus")+'" value="'+esc(F.note)+'"></div>';
  if(T==="move"){
    body+='<div class="field"><label>Dari</label>'+walletChips(F.wallet,"data-from",null,F.ctx)+(H?fundChips(F.fund,"data-fund"):'')+'<span class="muted" style="font-size:12.5px">Saldo: <span class="num">'+rp(H?(fb[F.fund][F.wallet]||0):(bal[F.wallet]||0))+'</span></span></div>'+
     '<div class="field"><label>Ke</label>'+walletChips(F.to,"data-to",H?null:F.wallet)+(H?fundChips(F.toFund,"data-tofund"):'')+'</div>'+
     '<div class="field"><label for="fFee">Biaya admin (kalau ada)</label><div class="money"><input class="inp" id="fFee" inputmode="numeric" placeholder="0" value="'+dotted(F.fee)+'"></div></div>';
  }else{
    body+='<div class="field"><label>'+(T==="in"?"Masuk ke":"Pakai uang dari")+'</label>'+walletChips(F.wallet,"data-w",null,F.ctx)+'</div>'+
     (H?'<div class="field"><label>Dana</label>'+fundChips(F.fund,"data-fund")+
       (F.fund==="darurat"&&S.events.length?'<label style="margin-top:4px">Untuk kebutuhan</label><div class="chips"><button class="chip" data-ev="" aria-pressed="'+!F.event+'">Umum</button>'+S.events.filter(e=>!e.closed||e.id===F.event).map(e=>'<button class="chip" data-ev="'+esc(e.id)+'" aria-pressed="'+(F.event===e.id)+'">'+esc(e.name)+'</button>').join("")+'</div>':'')+
       (F.member&&memById(F.member)?'<span class="muted" style="font-size:12.5px">Dari anggota: <b>'+esc(memById(F.member).name)+'</b>'+(F.period?' · iuran '+monthLabel(F.period):'')+'</span>':'')+'</div>':'')+
     '<div class="field"><label>Kategori</label><div class="chips">'+catList(T).filter(c=>!c.hidden||c.id===F.cat).map(c=>'<button class="chip" data-cat="'+esc(c.id)+'" aria-pressed="'+(F.cat===c.id)+'">'+esc(c.name)+'</button>').join("")+'</div></div>';
  }
  body+='<div class="field"><label for="fDate">Tanggal</label><input class="inp" type="date" id="fDate" value="'+esc(F.date)+'" max="'+ymd(new Date())+'"></div>'+
   '<p class="err" id="fErr"></p>'+
   '<div class="row">'+(F.isEdit?'<button class="btn danger" data-confirm="deltx">Hapus</button>':'')+'<button class="btn wide" id="fSave">'+(F.isEdit?"Simpan perubahan":"Simpan")+'</button></div>';
  if(!$("#backdrop").hidden&&!focus){$("#sheet").innerHTML='<div class="grab"></div>'+body;bindTx(false);}
  else openSheet(body,()=>bindTx(true));
}
function bindTx(focus){
  const sh=$("#sheet"),amt=$("#fAmt");
  const sync=()=>{F.amount=digits(amt.value);F.date=$("#fDate").value||ymd(new Date());F.note=$("#fNote").value;const fee=$("#fFee");if(fee)F.fee=digits(fee.value);};
  moneyInput(amt);if($("#fFee"))moneyInput($("#fFee"));
  sh.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-close")){closeSheet();return;}
    if(b.dataset.confirm)return; // handled globally
    sync();
    if(b.dataset.t&&b.dataset.t!==F.type){F.type=b.dataset.t;if(F.type!=="move")F.cat=(catList(F.type).find(c=>!c.hidden)||{id:"lain"}).id;else{F.cat=null;if(!F.to||F.to===F.wallet)F.to=(S.wallets.find(w=>w.id!==F.wallet)||{}).id||null;}drawTx(false);return;}
    if(b.dataset.q!=null){F.amount=b.dataset.q==="0"?0:F.amount+Number(b.dataset.q);amt.value=dotted(F.amount);return;}
    if(b.dataset.w){F.wallet=b.dataset.w;drawTx(false);return;}
    if(b.dataset.from){F.wallet=b.dataset.from;if(F.to===F.wallet&&!isHouse())F.to=(S.wallets.find(w=>w.id!==F.wallet)||{}).id||null;drawTx(false);return;}
    if(b.dataset.to){F.to=b.dataset.to;drawTx(false);return;}
    if(b.dataset.fund){const was=F.fund;F.fund=b.dataset.fund;if(F.type==="move"){if(F.toFund===was)F.toFund=F.fund;}else if(F.fund!=="darurat")F.event=null;drawTx(false);return;}
    if(b.dataset.tofund){F.toFund=b.dataset.tofund;drawTx(false);return;}
    if(b.dataset.ev!=null){F.event=b.dataset.ev||null;drawTx(false);return;}
    if(b.dataset.cat){F.cat=b.dataset.cat;sh.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x===b));return;}
    if(b.id==="fSave")saveTx();
  };
  if(focus&&!F.isEdit)setTimeout(()=>amt.focus(),60);
}
function saveTx(){
  const err=m=>{$("#fErr").textContent=m;};
  if(!(F.amount>0))return err("Isi dulu jumlah uangnya.");
  if(!F.wallet||!wById(F.wallet))return err("Pilih dompetnya.");
  if(F.type==="move"){if(!F.to||!wById(F.to))return err(S.wallets.length<2?"Tambah akun e-money dulu di halaman Dompet biar bisa pindah saldo.":"Pilih dompet tujuan.");if(F.to===F.wallet&&(!isHouse()||F.toFund===F.fund))return err(isHouse()?"Asal dan tujuan sama. Ganti akun atau dananya.":"Dompet asal dan tujuan harus beda.");}
  if(F.date>ymd(new Date()))return err("Tanggal nggak boleh di masa depan.");
  const tx={id:F.id||newId(),type:F.type,amount:F.amount,wallet:F.wallet,date:F.date,note:(F.note||"").trim().slice(0,80),created:F.created||Date.now()};
  if(F.type==="move"){tx.to=F.to;tx.fee=F.fee||0;}else tx.cat=F.cat||"lain";
  if(isHouse()){tx.fund=F.fund||"kas";if(F.type==="move")tx.toFund=F.toFund||tx.fund;
    if(tx.fund==="darurat"&&F.event&&F.type!=="move")tx.event=F.event;
    if(F.member&&F.type==="in"){tx.member=F.member;if(F.period&&!tx.event)tx.period=F.period;}}
  const wasEdit=F.isEdit,bn=budgetNote(tx);closeSheet();putTx(tx);if(bn)toast(bn,4500);else toast(wasEdit?"Perubahan disimpan.":"Tercatat!");
}

        const want=digits($("#wBal").value);

function curMonth(off){const n=new Date();const d=new Date(n.getFullYear(),n.getMonth()+(off||0),1);return d.getFullYear()+"-"+pad(d.getMonth()+1);}
function monthAdd(m,k){const[y,mo]=m.split("-").map(Number);const d=new Date(y,mo-1+k,1);return d.getFullYear()+"-"+pad(d.getMonth()+1);}
function monthLabel(m,shortName){const[y,mo]=m.split("-").map(Number);return(shortName?BLN:BULAN)[mo-1]+" "+y;}
function monthRel(off){return off===0?"Bulan ini":off===-1?"Bulan lalu":off===1?"Bulan depan":off<0?(-off)+" bulan lalu":off+" bulan lagi";}
const memById=id=>S.members.find(m=>m.id===id);
const evById=id=>S.events.find(e=>e.id===id);
const initial=n=>esc((n||"?").trim().charAt(0).toUpperCase());
function dueFor(m){const L=S.dues.slice().sort((a,b)=>a.from<b.from?-1:1);let a=L.length?L[0].amount:0;for(const d of L)if(d.from<=m)a=d.amount;return a;}
const memActive=(mb,m)=>(!mb.since||mb.since<=m)&&(!mb.until||m<=mb.until);
function paidIuran(mid,m){let s=0;for(const t of S.txs)if(t.type==="in"&&t.member===mid&&t.period===m&&!t.event)s+=Number(t.amount)||0;return s;}
function paidEvent(mid,eid){let s=0;for(const t of S.txs)if(t.type==="in"&&t.member===mid&&t.event===eid)s+=Number(t.amount)||0;return s;}
const stOf=(p,due)=>due>0&&p>=due?"lunas":p>0?"sebagian":"belum";
function duesStats(m){
  const due=dueFor(m);
  const rows=S.members.filter(mb=>memActive(mb,m)).map(mb=>{const p=paidIuran(mb.id,m);return{mb,paid:p,due,st:stOf(p,due)};});
  return{due,rows,lunas:rows.filter(r=>r.st==="lunas").length,n:rows.length,collected:rows.reduce((a,r)=>a+r.paid,0),target:due*rows.length};
}
function evStats(ev){
  const rows=ev.members.map(memById).filter(Boolean).map(mb=>{const p=paidEvent(mb.id,ev.id);return{mb,paid:p,due:ev.perPerson,st:stOf(p,ev.perPerson)};});
  let collected=0,spent=0;
  for(const t of S.txs){if(t.event!==ev.id)continue;if(t.type==="in")collected+=Number(t.amount)||0;else if(t.type==="out")spent+=Number(t.amount)||0;}
  return{rows,lunas:rows.filter(r=>r.st==="lunas").length,n:rows.length,collected,spent,target:ev.perPerson*rows.length};
}
function pillHTML(r){
  if(r.st==="lunas")return '<span class="pill lunas">Lunas</span>';
  if(r.st==="sebagian")return '<span class="pill sebagian">Kurang '+short(r.due-r.paid)+'</span>';
  return '<span class="pill belum">Belum</span>';
}
function memRowHTML(r,attr){
  return '<button class="mrow '+r.st+'" '+attr+'="'+esc(r.mb.id)+'"><span class="av">'+initial(r.mb.name)+'</span><span class="mid"><span class="t1">'+esc(r.mb.name)+'</span><span class="t2 num">'+(r.paid?"Bayar "+rp(r.paid)+" dari "+rp(r.due):"Tagihan "+rp(r.due))+'</span></span>'+pillHTML(r)+'</button>';
}

   '<div class="field"><label>Uangnya masuk ke</label><div class="chips" id="pW">'+S.wallets.map(w=>'<button class="chip" data-pw="'+esc(w.id)+'" aria-pressed="'+(PAY.wallet===w.id)+'"><span class="dot '+(w.kind==="cash"?"cash":"em")+'"></span>'+esc(w.name)+'</button>').join("")+'</div>'+
    '<span class="muted" style="font-size:12.5px">Masuk ke '+(kind==="iuran"?"kas bulanan":"dana darurat")+'.</span></div>'+
   '<div class="field"><label for="pDate">Tanggal bayar</label><input class="inp" type="date" id="pDate" value="'+PAY.date+'" max="'+ymd(new Date())+'"></div>'+
   '<p class="err" id="pErr"></p><button class="btn wide" id="pSave">Simpan pembayaran</button>'+
   (list.length?'<div class="stack" style="gap:0"><h3>Riwayat bayar</h3><div class="txlist">'+list.map(txRow).join("")+'</div></div>':'');
  openSheet(html,()=>{
    const amt=$("#pAmt");moneyInput(amt);
    $("#sheet").onclick=e=>{const b=e.target.closest("button");if(!b)return;
      if(b.hasAttribute("data-close"))return closeSheet();
      if(b.dataset.pq){amt.value=dotted(Number(b.dataset.pq));return;}
      if(b.dataset.pw){PAY.wallet=b.dataset.pw;document.querySelectorAll("[data-pw]").forEach(x=>x.setAttribute("aria-pressed",x===b));return;}
      if(b.id==="pSave"){PAY.amount=digits(amt.value);PAY.date=$("#pDate").value||ymd(new Date());savePay();}
    };
    if(rest)setTimeout(()=>amt.select(),60);
  });

function savePay(){
  const err=m=>{$("#pErr").textContent=m;};
  const P=PAY,mb=memById(P.mid);
  if(!(P.amount>0))return err("Isi dulu jumlah yang dibayar.");
  if(!wById(P.wallet))return err("Pilih uangnya masuk ke mana.");
  if(P.date>ymd(new Date()))return err("Tanggal nggak boleh di masa depan.");
  const base={type:"in",wallet:P.wallet,date:P.date};
  const out=[];
  if(P.kind==="iuran"){
    let left=P.amount,m=P.key;
    for(let i=0;i<36&&left>0;i++){
      const need=Math.max(0,dueFor(m)-paidIuran(P.mid,m));
      const take=i===35?left:Math.min(left,need);
      if(take>0){out.push({...base,id:newId(),amount:take,note:"Iuran "+monthLabel(m,true)+" – "+mb.name,created:Date.now()+i,cat:"iuran",fund:"kas",member:P.mid,period:m});left-=take;}
      m=monthAdd(m,1);
    }
  }else{
    const ev=evById(P.key);
    out.push({...base,id:newId(),amount:P.amount,note:"Iuran "+ev.name+" – "+mb.name,created:Date.now(),cat:"darurat",fund:"darurat",member:P.mid,event:P.key});
  }
  closeSheet();putTxs(out);
  if(out.length>1)toast("Tercatat. "+mb.name+" bayar sampai "+monthLabel(out[out.length-1].period,true)+".",3500);
  else toast("Tercatat. "+mb.name+" bayar "+rp(P.amount)+".");
}

function saveMembers(){
  const err=t=>{$("#mmErr").textContent=t;};
  const m=curMonth();
  if(!MM.due)return err("Isi nominal iuran bulanan.");
  const rows=MM.rows.filter(r=>!(r.isNew&&!r.name.trim()));

  const lower=rows.map(r=>r.name.trim().toLowerCase());if(new Set(lower).size!==lower.length)return err("Ada nama anggota yang dobel.");
  S.members=rows.map(r=>{const o={id:r.id,name:r.name.trim(),since:r.since||m,until:null};
    if(r.off){const old=S.members.find(x=>x.id===r.id);o.until=old&&old.until&&old.until<m?old.until:m;}return o;});
  if(MM.due!==dueFor(m)){S.dues=S.dues.filter(d=>d.from!==m).concat([{from:m,amount:MM.due}]);}
  closeSheet();MM=null;saveData();toast("Anggota & iuran disimpan.");

/* ---------- report ---------- */
function reportText(m){
  const T=totals(),s=duesStats(m),B=book(),[y,mo]=m.split("-").map(Number);
  const L=[];
  L.push("*"+B.name+" – "+monthLabel(m)+"*");
  L.push("");
  L.push("💰 *Kas bulanan: "+rp(T.fund.kas.all)+"*");
  L.push("Cash "+rp(T.fund.kas.cash)+" · E-money "+rp(T.fund.kas.em));
  L.push("🚨 *Dana darurat: "+rp(T.fund.darurat.all)+"*");
  L.push("Cash "+rp(T.fund.darurat.cash)+" · E-money "+rp(T.fund.darurat.em));
  L.push("");
  L.push("📋 *Iuran "+BULAN[mo-1]+"* ("+rp(s.due)+"/orang): "+s.lunas+"/"+s.n+" lunas, terkumpul "+rp(s.collected));
  const lun=s.rows.filter(r=>r.st==="lunas"),seb=s.rows.filter(r=>r.st==="sebagian"),bel=s.rows.filter(r=>r.st==="belum");
  if(lun.length)L.push("✅ Lunas: "+lun.map(r=>r.mb.name).join(", "));
  if(seb.length)L.push("🟡 Kurang: "+seb.map(r=>r.mb.name+" ("+rp(r.due-r.paid)+")").join(", "));
  if(bel.length)L.push("❌ Belum: "+bel.map(r=>r.mb.name).join(", "));
  const act=S.events.filter(e=>!e.closed);
  if(act.length){
    L.push("");L.push("🔧 *Iuran darurat*");
    act.forEach(e=>{const es=evStats(e),sisa=es.collected-es.spent;
      L.push("• "+e.name+" ("+rp(e.perPerson)+"/orang): "+es.lunas+"/"+es.n+" lunas");
      L.push("  Terkumpul "+rp(es.collected)+", terpakai "+rp(es.spent)+(sisa<0?", kurang "+rp(-sisa):", sisa "+rp(sisa)));
      const nb=es.rows.filter(r=>r.st!=="lunas");if(nb.length)L.push("  Belum lunas: "+nb.map(r=>r.mb.name).join(", "));});
  }
  const a=m+"-01",z=m+"-31";
  const kas=sortedTx(S.txs.filter(t=>t.date>=a&&t.date<=z&&fundOf(t)==="kas")).reverse();
  const tin=kas.filter(t=>t.type==="in").reduce((x,t)=>x+(+t.amount),0),outs=kas.filter(t=>t.type==="out"),tout=outs.reduce((x,t)=>x+(+t.amount),0)+kas.filter(t=>t.type==="move").reduce((x,t)=>x+(+t.fee||0),0);
  L.push("");L.push("🧾 *Kas "+BULAN[mo-1]+"*: masuk "+rp(tin)+", keluar "+rp(tout));
  const other=kas.filter(t=>t.type==="in"&&!t.member);
  if(other.length){L.push("Masuk lain:");other.forEach(t=>L.push("• "+pYmd(t.date).getDate()+" "+BLN[mo-1]+" – "+(t.note||catName("in",t.cat))+" "+rp(t.amount)));}
  if(outs.length){L.push("Pengeluaran:");outs.forEach(t=>L.push("• "+pYmd(t.date).getDate()+" "+BLN[mo-1]+" – "+(t.note||catName("out",t.cat))+" "+rp(t.amount)));}
  else L.push("Belum ada pengeluaran.");
  L.push("");L.push("_Dicatat pakai Duit Gue_");
  return L.join("\n");
}

  const m=curMonth(S.view==="iuran"?S.iu.off:0),txt=reportText(m);

function stockMap(){
  const m={};S.items.forEach(i=>m[i.id]=Number(i.stock0)||0);
  for(const t of S.txs){if(!Array.isArray(t.lines))continue;const sign=t.cat==="kulakan"?1:t.cat==="jual"?-1:0;if(!sign)continue;
    for(const l of t.lines)if(l.item in m)m[l.item]+=sign*(Number(l.qty)||0);}
  return m;
}
const isLow=(it,st)=>isShop()&&st<=(it.min==null?5:it.min);

function topItems(a,b){
  const m={};
  for(const t of S.txs){if(t.cat!=="jual"||!Array.isArray(t.lines)||t.date<a||t.date>b)continue;
    for(const l of t.lines){const k=l.item||l.name;m[k]=m[k]||{name:(itemById(l.item)||{}).name||l.name,qty:0,rev:0,profit:0};m[k].qty+=+l.qty;m[k].rev+=l.qty*l.price;m[k].profit+=l.qty*(l.price-(l.cost||0));}}
  return Object.values(m).sort((x,y)=>y.qty-x.qty);
}
function salesIn(a,b){let rev=0,n=0,hpp=0;for(const t of S.txs){if(t.cat!=="jual"||t.date<a||t.date>b)continue;n++;rev+=+t.amount;if(Array.isArray(t.lines))hpp+=t.lines.reduce((x,l)=>x+(l.cost||0)*l.qty,0);}return{rev,n,hpp};}

function saveSale(){
  const err=m=>{$("#coErr").textContent=m;};

  if(!lines.length)return err("Keranjang masih kosong.");

  if(CO.date>ymd(new Date()))return err("Tanggal nggak boleh di masa depan.");
  const isCash=(wById(CO.wallet)||{}).kind==="cash";
  if(isCash&&CO.paid&&CO.paid<tot)return err("Uang yang diterima kurang dari total.");
  const tx={id:newId(),type:"in",cat:"jual",amount:tot,wallet:CO.wallet,date:CO.date,created:Date.now(),
    note:lines.map(l=>l.it.name+(l.qty>1?" ×"+l.qty:"")).join(", ").slice(0,80),

  const change=isCash&&CO.paid?CO.paid-tot:0;

function doBackup(){
  const today=ymd(new Date());
  const data={app:"duitgue",version:2,exportedAt:new Date().toISOString(),store:S.store};
  try{
    const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));
    const a=document.createElement("a");a.href=url;a.download="duitgue-backup-"+today+".json";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);

    toast("File backup disimpan. Taruh di tempat aman, misalnya Google Drive.",4000);render();
  }catch(e){toast("Backup gagal dibuat di browser ini.");}

const str=(v,n)=>String(v==null?"":v).slice(0,n);
const isMonth=v=>typeof v==="string"&&/^\d{4}-\d{2}$/.test(v);
function sanitizeData(d,allowEmpty){
  if(!d||!Array.isArray(d.wallets)||!Array.isArray(d.txs))return null;
  const wallets=d.wallets.filter(w=>w&&typeof w.id==="string"&&typeof w.name==="string"&&(w.kind==="cash"||w.kind==="emoney"))
    .map(w=>({id:w.id.slice(0,40),name:w.name.slice(0,24),kind:w.kind,start:Number(w.start)||0}));
  if(!wallets.length&&!allowEmpty)return null;
  const txs=d.txs.filter(t=>t&&typeof t.id==="string"&&["in","out","move"].includes(t.type)&&Number(t.amount)>0&&/^\d{4}-\d{2}-\d{2}$/.test(t.date||""))
    .map(t=>{const o={id:t.id.slice(0,60),type:t.type,amount:Math.round(Number(t.amount)),wallet:str(t.wallet,40),date:t.date,note:str(t.note,80),created:Number(t.created)||0};
      if(t.type==="move"){o.to=str(t.to,40);o.fee=Math.max(0,Number(t.fee)||0);}else o.cat=str(t.cat||"lain",40);
      if(t.fund==="darurat"||t.fund==="kas")o.fund=t.fund;
      if(t.type==="move"&&(t.toFund==="darurat"||t.toFund==="kas"))o.toFund=t.toFund;
      if(typeof t.member==="string")o.member=t.member.slice(0,40);
      if(isMonth(t.period))o.period=t.period;
      if(typeof t.event==="string")o.event=t.event.slice(0,40);
      if(typeof t.link==="string")o.link=t.link.slice(0,60);
      if(Array.isArray(t.lines))o.lines=t.lines.filter(l=>l&&Number(l.qty)>0).slice(0,200).map(l=>({item:str(l.item,40),name:str(l.name,40),qty:Math.round(Number(l.qty)),price:Math.max(0,Math.round(Number(l.price)||0)),cost:Math.max(0,Math.round(Number(l.cost)||0))}));
      return o;});
  let cats=null;
  if(d.cats&&Array.isArray(d.cats.out)&&Array.isArray(d.cats.in)){
    const fix=(l,b)=>l.filter(c=>c&&typeof c.id==="string"&&typeof c.name==="string").map(c=>{const o={id:c.id.slice(0,40),name:c.name.slice(0,24),hidden:!!c.hidden};if(b)o.budget=Math.max(0,Number(c.budget)||0);return o;});
    cats={out:fix(d.cats.out,true),in:fix(d.cats.in,false)};
    if(!cats.out.length||!cats.in.length)cats=null;
  }
  const members=(Array.isArray(d.members)?d.members:[]).filter(m=>m&&typeof m.id==="string"&&typeof m.name==="string")
    .map(m=>({id:m.id.slice(0,40),name:m.name.slice(0,30),since:isMonth(m.since)?m.since:null,until:isMonth(m.until)?m.until:null}));
  const dues=(Array.isArray(d.dues)?d.dues:[]).filter(x=>x&&isMonth(x.from)&&Number(x.amount)>=0).map(x=>({from:x.from,amount:Math.round(Number(x.amount))}));
  const events=(Array.isArray(d.events)?d.events:[]).filter(e=>e&&typeof e.id==="string"&&typeof e.name==="string")
    .map(e=>({id:e.id.slice(0,40),name:e.name.slice(0,40),perPerson:Math.max(0,Math.round(Number(e.perPerson)||0)),total:Math.max(0,Math.round(Number(e.total)||0)),created:/^\d{4}-\d{2}-\d{2}$/.test(e.created||"")?e.created:ymd(new Date()),members:(Array.isArray(e.members)?e.members:[]).filter(x=>typeof x==="string").map(x=>x.slice(0,40)),closed:!!e.closed}));
  const items=(Array.isArray(d.items)?d.items:[]).filter(i=>i&&typeof i.id==="string"&&typeof i.name==="string")
    .map(i=>({id:i.id.slice(0,40),name:i.name.slice(0,40),price:Math.max(0,Math.round(Number(i.price)||0)),cost:Math.max(0,Math.round(Number(i.cost)||0)),stock0:Math.round(Number(i.stock0)||0),min:Math.max(0,Math.round(Number(i.min)||0)),hidden:!!i.hidden}));
  return{wallets,txs,cats,sample:false,members,dues,events,items};
}
function sanitizeBackup(d){
  if(!d||d.app!=="duitgue")return null;
  if(d.version===2&&d.store&&Array.isArray(d.store.books)){
    const books=d.store.books.filter(b=>b&&typeof b.id==="string"&&TYPES[b.type]&&b.data)
      .map(b=>{const data=sanitizeData(b.data,true);return data?{id:b.id.slice(0,40),type:b.type,name:str(b.name,30)||TYPES[b.type].def,created:/^\d{4}-\d{2}-\d{2}$/.test(b.created||"")?b.created:ymd(new Date()),data}:null;}).filter(Boolean);
    if(!books.length)return null;
    const active=books.some(b=>b.id===d.store.active)?d.store.active:books[0].id;
    return{books,active};
  }
  const data=sanitizeData(d,false);if(!data)return null;
  const id="b"+newId();
  return{books:[{id,type:"personal",name:"Pribadi",created:ymd(new Date()),data}],active:id};
}

function budgetNote(tx){
  if(tx.type!=="out")return null;
  const c=catList("out").find(k=>k.id===tx.cat);if(!c||!(c.budget>0))return null;
  const m=tx.date.slice(0,7);let sum=Number(tx.amount)||0;
  for(const t of S.txs){if(t.id!==tx.id&&t.type==="out"&&t.cat===tx.cat&&(t.date||"").slice(0,7)===m)sum+=Number(t.amount)||0;}
  if(sum>c.budget)return "Tercatat. "+c.name+" bulan ini udah "+rp(sum)+", lewat dari batas "+rp(c.budget)+".";
  if(sum>=c.budget*0.8)return "Tercatat. "+c.name+" udah "+Math.round(sum/c.budget*100)+"% dari batas bulan ini.";
  return null;
}

      const out={};
      for(const t of ["out","in"]){
        const used=new Set(S.txs.filter(x=>x.type===t).map(x=>x.cat));
        const list=[];const names=new Set();
        for(const c of CM[t]){const nm=(c.name||"").trim();
          if(!nm){if(used.has(c.id)){$("#cmErr").textContent="Kategori yang udah dipakai nggak boleh dikosongin namanya. Sembunyikan aja kalau nggak dipakai lagi.";return;}continue;}
          if(names.has(nm.toLowerCase())){$("#cmErr").textContent="Ada nama kategori yang dobel: "+nm+".";return;}
          names.add(nm.toLowerCase());
          const o={id:c.id,name:nm,hidden:!!c.hidden};if(t==="out")o.budget=c.budget||0;list.push(o);}
        if(!list.some(c=>!c.hidden)){$("#cmErr").textContent="Minimal harus ada satu kategori "+(t==="out"?"keluar":"masuk")+" yang tampil.";return;}
        out[t]=list;
      }
      closeSheet();CM=null;saveProfile(S.wallets,S.sample,out);toast("Kategori disimpan.");
    }
  };
}

init();
})();
</script>
